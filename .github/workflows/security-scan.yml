# .github/workflows/snyk-scan.yml   SKELETON - complete every TODO
name: snyk-security-scan

# 1) SCM trigger
# TODO: add only what you need
on:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:
    branches:
      - master
      - 'feature/**' # Trigger ตอนที่มี Pull Request หรือการ Push ขึ้น branch master หรือ branch ที่ชือขึ้นต้นด้วย "feature/" (feature branch)

permissions:
  contents: read # Set Permission เป็น Read เพราะว่า Pipeline เราทําหน้าที่เป็น Gate คอย scan ช่องโหว่ไม่ควรได้สิทธิอื่นเพิ่มเติม

env:
  SNYK_VERSION: "1.1308.4" # เลือก version นี้เพราะเป็น version ที่ stable (pin an exact CLI version (no latest))

jobs:
  snyk-scan:                           # 2) Trigger Scan -> 3) Runner
    runs-on: ubuntu-24.04
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}   # CI secret - never commit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # version 4.4.0 เลือก version นี้เพราะเป็น version ที่ stable มากที่สุดของ v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # version 4.4.0 เลือก version นี้เพราะเป็น version ที่ stable มากที่สุดของ v4
        with:
          node-version: "22"


      - name: Install Snyk CLI (pinned)
        run: npm install -g "snyk@${SNYK_VERSION}"

      - name: Install project dependencies # Install Dependency เพื่อที่จะ test SCA
        run: npm install --ignore-scripts
      - name: Authenticate
        run: snyk auth "$SNYK_TOKEN"   # or rely on SNYK_TOKEN env only
      
      - name: Snyk Code (SAST)
        id: sast
        continue-on-error: true # ถ้ามี Error ปล่อยให้ไป Step ถัดไปได้เพราะจะไปหยุดที่ step gate
        run: snyk code test --severity-threshold=high --sarif-file-output=results/snyk-code.sarif
        # TODO: what happens to the next steps when this exits 1?
      - name: Snyk Open Source (SCA)
        id: sca
        continue-on-error: true
        run: snyk test --severity-threshold=high --json-file-output=results/snyk-sca.json
      - name: Upload results            # 4) Result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: snyk-results
          path: results                   # TODO: keep results even on failure

      # TODO: quality gate - fail the pipeline on High/Critical
      
      - name: Quality Gate # เช็คว่า step ก่อนหน้ามี Error ไหม
        if: always()
        run: |
          if ["${{steps.sast.outcome}}" == "failure"] || ["${{steps.sca.outcome}}" == "failure"]; then
            echo "Quality Gate FAILED - High or Critical vulnerabilities detected."
            exit 1
          elif [ "${{ steps.sast.outcome }}" == "success" ] && [ "${{ steps.sca.outcome }}" == "success" ]; then
            echo "Quality Gate PASSED - No High or Critical vulnerabilities found."
          else
            echo "Quality Gate FAILED - One or more scan steps not complete."
            exit 1
          fi
       